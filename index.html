<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Move Helper</title>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #2b2b2b;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h1 { margin-bottom: 5px; }
        p { color: #aaaaaa; margin-bottom: 20px; }
        
        #board-container {
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            margin: 0 auto 20px;
            border: 4px solid #444;
            border-radius: 4px;
        }
        
        .controls { margin-bottom: 20px; }
        
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 5px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.2s;
        }
        
        button:hover { background-color: #45a049; }
        #suggestBtn { background-color: #008CBA; }
        #suggestBtn:hover { background-color: #007399; }
        
        #status {
            font-weight: bold;
            font-size: 20px;
            margin-top: 10px;
            color: #ffcc00;
        }
        
        .highlight-square {
            box-shadow: inset 0 0 3px 3px yellow;
        }
    </style>
</head>
<body>

    <h1>Chess Move Helper</h1>
    <p>Drag and drop pieces to play. Click "Suggest Move" for a hint!</p>

    <div class="controls">
        <button id="startBtn">Reset Game</button>
        <button id="suggestBtn">Suggest a Move</button>
    </div>

    <div id="board-container">
        <div id="myBoard"></div>
    </div>
    
    <div id="status">White to move</div>

    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
        // Initialize variables
        var board = null;
        var game = new Chess();
        var $status = $('#status');

        function removeHighlights() {
            $('.highlight-square').removeClass('highlight-square');
        }

        // Prevent picking up pieces if the game is over or it's not that side's turn
        function onDragStart (source, piece, position, orientation) {
            if (game.game_over()) return false;
            if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
                (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
                return false;
            }
        }

        // Validate the move when a piece is dropped
        function onDrop (source, target) {
            removeHighlights();
            var move = game.move({
                from: source,
                to: target,
                promotion: 'q' // Always promote to a queen for simplicity
            });

            // If illegal move, snap the piece back
            if (move === null) return 'snapback';

            updateStatus();
        }

        // Update the board position after the piece snap animation
        function onSnapEnd () {
            board.position(game.fen());
        }

        // Update the status text below the board
        function updateStatus () {
            var statusHTML = '';
            var moveColor = (game.turn() === 'w') ? 'White' : 'Black';

            if (game.in_checkmate()) {
                statusHTML = 'Game over, ' + moveColor + ' is in checkmate.';
            } else if (game.in_draw()) {
                statusHTML = 'Game over, drawn position';
            } else {
                statusHTML = moveColor + ' to move';
                if (game.in_check()) {
                    statusHTML += ', ' + moveColor + ' is in check!';
                }
            }
            $status.html(statusHTML);
        }

        // Configure the chessboard
        var config = {
            draggable: true,
            position: 'start',
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd,
            // Fetch piece images directly from chessboardjs servers so it works instantly on GitHub
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        };
        
        board = Chessboard('myBoard', config);
        updateStatus();
        
        // Make the board recalculate its size when the screen resizes
        $(window).resize(board.resize);

        // Button functionality: Reset
        $('#startBtn').on('click', function() {
            game.reset();
            board.start();
            removeHighlights();
            updateStatus();
        });

        // Button functionality: Move Helper
        $('#suggestBtn').on('click', function() {
            if (game.game_over()) {
                alert("The game is already over!");
                return;
            }
            
            // Use Stockfish AI to get the best move
            var btn = $(this);
            btn.text('Thinking...').prop('disabled', true);

            fetch('https://chess-api.com/v1', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fen: game.fen(), depth: 8 })
            })
            .then(res => res.json())
            .then(data => {
                removeHighlights();
                $('#myBoard .square-' + data.from).addClass('highlight-square');
                $('#myBoard .square-' + data.to).addClass('highlight-square');
                btn.text('Suggest a Move').prop('disabled', false);
            })
            .catch(err => {
                alert("Error connecting to AI.");
                btn.text('Suggest a Move').prop('disabled', false);
            });
        });
    </script>
</body>
</html>
