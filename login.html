<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - M-League Fantasy</title>
    <style>
        body { 
            font-family: -apple-system, sans-serif; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; background: #0b0e1e; color: white; margin: 0; 
        }
        .login-box { 
            background: #1a1a1a; padding: 40px 30px; border-radius: 15px; 
            text-align: center; width: 85%; max-width: 320px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #333;
        }
        h2 { margin-top: 0; color: #e90052; font-size: 1.8rem; margin-bottom: 5px; }
        .sub { font-size: 0.9rem; color: #888; margin-bottom: 30px; }
        
        button {
            background: white; color: #333; border: none; padding: 12px 20px; 
            border-radius: 50px; font-weight: bold; cursor: pointer; display: flex; 
            align-items: center; justify-content: center; width: 100%; margin-top: 10px;
            font-size: 1rem; transition: 0.2s;
        }
        button:active { transform: scale(0.98); background: #eee; }
        button img { width: 20px; margin-right: 10px; }
        
        #status { margin-top: 20px; font-size: 0.8rem; color: #00ff87; min-height: 20px; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>M-LEAGUE</h2>
        <div class="sub">Fantasy Football Manager</div>
        
        <button onclick="googleLogin()">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="G">
            Sign in with Google
        </button>
        
        <div id="status"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // YOUR KEYS ARE HERE
        const firebaseConfig = {
            apiKey: "AIzaSyCcaK594z5ITZo3xPy9itFd3LdJI0ggjtk",
            authDomain: "m-league-fantasy.firebaseapp.com",
            projectId: "m-league-fantasy",
            storageBucket: "m-league-fantasy.firebasestorage.app",
            messagingSenderId: "301677140666",
            appId: "1:301677140666:web:1fe5321957ea502fdac083"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        window.googleLogin = function() {
            const statusEl = document.getElementById('status');
            statusEl.style.color = "#ccc";
            statusEl.innerText = "Connecting...";
            
            signInWithPopup(auth, provider)
                .then((result) => {
                    const user = result.user;
                    statusEl.style.color = "#00ff87";
                    statusEl.innerText = "Welcome, " + user.displayName.split(" ")[0] + "!";
                    
                    // Save user to phone memory
                    localStorage.setItem('user', JSON.stringify({
                        uid: user.uid,
                        name: user.displayName,
                        email: user.email,
                        photo: user.photoURL
                    }));
                    
                    // Redirect to Game
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 1500);
                })
                .catch((error) => {
                    alert(error.message);
                    statusEl.style.color = "#ff4d4d";
                    statusEl.innerText = "Login Failed. Try again.";
                });
        }
    </script>
</body>
</html>
